<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ออฟไลน์ · Tha Phae Gate (Chiang Mai)</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f2015;
        color: #f4efe6;
        font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Noto Sans SC", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 30rem;
      }
      img {
        width: 88px;
        height: 88px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 8px;
        line-height: 1.6;
        color: #c9c2b4;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 28px;
        border-radius: 999px;
        background: #c1663f;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon.svg" alt="Tha Phae Gate, Chiang Mai" />
      <h1>คุณออฟไลน์อยู่ / You are offline</h1>
      <p>ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้ กรุณาตรวจสอบเครือข่ายแล้วลองอีกครั้ง</p>
      <p>No internet connection. Please check your network and try again.</p>
      <a href="/th">ลองอีกครั้ง / Retry</a>
    </div>
  </body>
</html>
